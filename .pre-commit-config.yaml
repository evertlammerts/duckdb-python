# Fast checks only: anything needing a built extension runs in CI, since a hook that waits on a build gets turned off.
# third_party is DuckDB source, shipped verbatim; reformatting it would break the diff against upstream.
exclude: ^third_party/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        # The engine library is never committed; it is downloaded.
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.2
    hooks:
      - id: clang-format
        files: \.(c|cpp|cc|h|hpp|cxx|hxx)$
