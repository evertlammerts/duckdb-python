# The function namespaces: which engine functions each family holds, entered
# through .str() / .dt() / .list() / .json() on an expression.
#
# The two reasons the families exist:
#   1. Completion: without them, every function would be a method on every
#      expression, several hundred names after each dot.
#   2. Short names without collisions: .list().min() can mean list_min only
#      because .min() still means the aggregate.
#
# Each entry:
#   method = { sql = "engine_function" [, subject = N] [, types = [...]]
#              [, returns = "family"] [, params = [...]] [, lambda = N]
#              [, doc = "..."] }.
# subject is where the expression goes among the arguments (default first).
# types pins one catalog overload where the fitting ones disagree on the
# return class; the generator refuses the ambiguity until a pin decides it.
# returns is for macro-backed entries only: the catalog carries no return
# type for a macro, so the family of the result is declared here, validated
# by hand against the macro's definition, and only where the macro returns
# its family's kind of value whatever it is given.
# params renames the method's parameters, for the entries whose catalog
# names are wrong (date_part calls its specifier `ts`).
# lambda marks a Python-callable argument and its arity.
# `covers` names the rule (in gen_func_namespaces.py) for the catalog
# functions this family must account for; anything covered but unlisted
# goes under `ignore`, deliberately. The rules read categories and
# parameter types, which macros lack, so macros outside the list family's
# `list_` name net are listed by hand when someone meets them.
# gen_func_namespaces.py verifies every entry and every coverage both ways;
# gen_aggregates.py checks the [aggregates] entries exist in the catalog.
# Method names may shadow the aggregate shortcuts (that is the design) but
# nothing else on Expr; the generator refuses any other collision.

[str]
blurb = "Text functions, applied to this expression as the string."
covers = "string"
ignore = [
  "array_extract",
  "bar",
  "chr",
  "concat",
  "format_bytes",
  "greatest",
  "hash",
  "hex",
  "least",
  "list_slice",
  "repeat",
  "to_base",
  "to_base64",
]
[str.methods]
ascii = { sql = "ascii" }
bin = { sql = "bin" }
bit_length = { sql = "bit_length" }
