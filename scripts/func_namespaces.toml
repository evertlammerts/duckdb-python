[dt]
blurb = "Date and time functions, applied to this expression as the date, time or timestamp."
covers = "temporal"
ignore = [
  # date_add is a macro (date + interval); the + operator already says it.
  "date_add",
  # Run-together spellings of date_diff, date_part, date_sub and date_trunc,
  # which the diff, part, sub and trunc methods already carry.
  "datediff",
  "datepart",
  "datesub",
  "datetrunc",
  "epoch_ms",
  "equi_width_bins",
  "generate_series",
  "isfinite",
  "isinf",
  "json_copy_strftime_if_date",
  "json_copy_strftime_if_timestamp",
  "range",
]
[dt.methods]
age = { sql = "age" }
century = { sql = "century" }
day = { sql = "day" }
dayname = { sql = "dayname" }
# A macro: day(last_day(date)), so it returns a number whatever it is given.
days_in_month = { sql = "days_in_month", doc = "How many days the date's month has" }
dayofmonth = { sql = "dayofmonth" }
dayofweek = { sql = "dayofweek" }
dayofyear = { sql = "dayofyear" }
decade = { sql = "decade" }
