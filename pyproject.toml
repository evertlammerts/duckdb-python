[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "duckdb"
description = "DuckDB in-process SQL OLAP database management system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
version = "0.0.1.dev0"
dependencies = []

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
# One abi3 wheel for 3.12 and up; nanobind has no stable ABI below that, so 3.11 gets a version-specific wheel.
wheel.py-api = "cp312"
wheel.packages = ["src/duckdb"]
sdist.include = ["src", "CMakeLists.txt"]

[dependency-groups]
# Mirrors build-system.requires so --no-build-isolation can install them first.
build = [
    "scikit-build-core>=0.10",
    "nanobind>=2.13",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]
# What the copied tests and the type stubs need; the package itself depends on nothing.
compat = [
    "numpy",
    "pandas",
    "pandas-stubs",
]
# The benchmark harness; CI installs the frozen pins in benchmarks/requirements-bench.txt, so keep both in step.
bench = [
    "pytest-codspeed>=5",
    "numpy",
    "pandas",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# strict-markers so a marker typo fails instead of selecting nothing; filterwarnings=error so a warning counts.
addopts = "-ra --verbose --strict-markers --strict-config -m 'not corpus'"
filterwarnings = ["error"]
markers = [
    "freethreaded: only meaningful on a free-threaded interpreter",
    "corpus: runs the engine's sqllogictest corpus; needs a duckdb checkout and a minute (pytest -m corpus)",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"
# compat/suite holds the previous package's tests unchanged, so nothing may rewrite them.
extend-exclude = ["compat/suite"]

[tool.ruff.lint]
select = [
    "ANN",  # flake8-annotations
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # flake8-docstrings
    "E",    # pycodestyle
    "EM",   # flake8-errmsg
    "F",    # pyflakes
    "I",    # isort
    "PERF", # perflint
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle
]
# Protocol methods and __init__ are covered by their class docstring.
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Operator methods return NotImplemented for an operand that is not ours, and its type cannot be spelled.
"src/duckdb/expr.py" = ["ANN401"]
# Naming these types would mean importing numpy into a package that depends on nothing.
"src/duckdb/_numpy.py" = ["ANN401"]
# Test names are the documentation; what matters is explained where it applies.
"tests/*" = ["D100", "D101", "D102", "D103"]
# Benchmark names are the documentation, same as tests.
"benchmarks/*" = ["D103"]

[tool.mypy]
files = ["src/duckdb", "tests", "scripts"]
strict = true
warn_unreachable = true
pretty = true
# Not 3.11: numpy's stubs use the `type` statement, which mypy rejects below 3.12.
python_version = "3.12"
