[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "duckdb"
description = "DuckDB in-process SQL OLAP database management system"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
version = "0.0.1.dev0"
dependencies = []

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"          # one abi3 wheel per platform, 3.12 and up
wheel.packages = ["src/duckdb"]
sdist.include = ["src", "CMakeLists.txt"]

[dependency-groups]
# Mirrors build-system.requires so --no-build-isolation can install them first.
build = [
    "scikit-build-core>=0.10",
    "nanobind>=2.13",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]
# What the adopted old-client tests import at module level, plus the stubs
# that type the egress surface. Test-only: the package itself depends on
# nothing.
compat = [
    "numpy",
    "pandas",
    "pandas-stubs",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# strict-markers so a typo in a marker fails instead of silently selecting
# nothing; filterwarnings=error so a warning is a result, not a scroll-by.
addopts = "-ra --verbose --strict-markers --strict-config -m 'not corpus'"
filterwarnings = ["error"]
markers = [
    "freethreaded: only meaningful on a free-threaded interpreter",
    "corpus: runs the engine's sqllogictest corpus; needs a duckdb checkout and a minute (pytest -m corpus)",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"
# compat/suite holds the old client's tests verbatim; nothing may rewrite
# them. The harness around them is ours and is linted.
extend-exclude = ["compat/suite"]

[tool.ruff.lint]
select = [
    "ANN",  # flake8-annotations
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # flake8-docstrings
    "E",    # pycodestyle
    "EM",   # flake8-errmsg
    "F",    # pyflakes
    "I",    # isort
    "PERF", # perflint
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle
]
# Protocol methods and __init__ are described by their class docstring;
# requiring one on each adds noise without adding meaning.
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Operator methods must be able to return NotImplemented, so Python can fall
# back to its own handling when the other operand is not ours. That value's
# type is not expressible, so the return annotations admit Any.
"src/duckdb/expr.py" = ["ANN401"]
# The converter passes the numpy module itself around and builds heterogeneous
# column tuples; naming their types would mean importing numpy to annotate a
# zero-dependency package.
"src/duckdb/_numpy.py" = ["ANN401"]
# Test names are the documentation; a docstring per assertion adds noise.
# Explanations that matter live in comments at the point they apply.
"tests/*" = ["D100", "D101", "D102", "D103"]

[tool.mypy]
files = ["src/duckdb", "tests", "scripts"]
strict = true
warn_unreachable = true
pretty = true
python_version = "3.12"
