# Gives the DuckDB engine this run builds against: the one pinned in third_party/duckdb_cpp/REF.
# The shipped C++ API comes from that same commit, and it may not compile against any other engine's C headers.
name: Engine

on:
  workflow_call:
    outputs:
      engine:
        description: The engine spec every job passes to `scripts/engine.py fetch`.
        value: ${{ jobs.resolve.outputs.engine }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      engine: ${{ steps.resolve.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        run: |
          spec=$(cat third_party/duckdb_cpp/REF)
          echo "engine=$spec" >> "$GITHUB_OUTPUT"
          echo "DuckDB engine: \`$spec\`" >> "$GITHUB_STEP_SUMMARY"
