# Resolves which DuckDB engine this run builds against: the newest published build on the 2.0 line.
# Resolved once per run, so every job fetches the same engine even if a new one is published mid-run.
name: Engine

on:
  workflow_call:
    outputs:
      engine:
        description: The engine spec every job passes to `scripts/engine.py fetch`.
        value: ${{ jobs.resolve.outputs.engine }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      engine: ${{ steps.resolve.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - id: resolve
        run: |
          spec=$(uv run scripts/engine.py resolve)
          echo "engine=$spec" >> "$GITHUB_OUTPUT"
          echo "DuckDB engine: \`$spec\`" >> "$GITHUB_STEP_SUMMARY"
