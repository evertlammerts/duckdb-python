# Publishes the wheel matrix to test.pypi, by hand only: nothing publishes on its own.
# The upload uses trusted publishing, which must name this repository, this file and the environment. No token.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: PEP 440 version to stamp and publish, such as 0.0.1.dev1
        required: true
        type: string

# Queue releases, never cancel one: a run that is already publishing must finish.
concurrency:
  group: release
  cancel-in-progress: false

# The one workflow that reaches an index gets the least token; the publish job grants itself what it needs.
permissions:
  contents: read

jobs:
  check:
    name: Preflight
    runs-on: ubuntu-24.04
    steps:
      # A dispatch runs on whichever branch was picked, and a feature branch reaching the index would be an accident.
      - name: A release comes from neo
        if: github.ref != 'refs/heads/neo'
        run: |
          echo "dispatch from neo, not ${GITHUB_REF#refs/heads/}" >&2
          exit 1
      # Checked here so a typo fails in seconds, not after the wheel matrix; the index never takes a name twice.
      - name: The version reads as PEP 440
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$' \
            || { echo "not a PEP 440 version: $VERSION" >&2; exit 1; }

  wheels:
    name: Build and verify
    needs: check
    uses: ./.github/workflows/wheels.yml
    with:
      version: ${{ inputs.version }}

  publish:
    name: Publish to test.pypi
    needs: wheels
    runs-on: ubuntu-24.04
    environment:
      name: test-pypi
      url: https://test.pypi.org/project/duckdb/${{ inputs.version }}/
    permissions:
      # id-token lets trusted publishing get an upload token; actions lets the job read this run's artifacts.
      id-token: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - name: Every artifact carries the stamped version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ls -l dist
          for whl in dist/*.whl; do
            case "$(basename "$whl")" in
              duckdb-"$VERSION"-*) ;;
              *) echo "unexpected artifact: $whl" >&2; exit 1;;
            esac
          done

      # Wheels only: an sdist would need a DuckDB build no installer can reach, and fail mid-install instead.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
