# Builds and verifies the wheel matrix against the DuckDB bundle.
# Three per platform: 3.11 alone because nanobind's stable ABI starts at 3.12, one for 3.12 and up, one free-threaded.
name: Build and test

on:
  push:
    branches: [neo]
  pull_request:
    branches: [neo]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Stamp this version into pyproject.toml before building.
        required: false
        type: string
        default: ""

# A newer push to the same ref supersedes whatever is still running.
# Set on the caller only: a called workflow dies with its caller, and a second group there risks a deadlock.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    uses: ./.github/workflows/engine.yml

  wheel:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        # target and flavor are real axes so they multiply; targets moved into include collapse to one job per flavor.
        target:
          [windows-amd64, windows-arm64, linux-x86_64, linux-aarch64, macos-arm64, macos-x86_64]
        # One CMake path serves all three: nanobind applies each setting only where it fits.
        flavor: [cp311, abi3, ft314]
        exclude:
          # No free-threaded CPython for Windows on ARM64, and uv quietly installs the x86_64 build instead.
          - target: windows-arm64
            flavor: ft314
        include:
          - { target: windows-amd64,  runner: windows-2022,     container: "" }
          - { target: windows-arm64,  runner: windows-11-arm,   container: "" }
          - { target: linux-x86_64,   runner: ubuntu-24.04,     container: "quay.io/pypa/manylinux_2_28_x86_64",  plat: manylinux_2_28_x86_64 }
          - { target: linux-aarch64,  runner: ubuntu-24.04-arm, container: "quay.io/pypa/manylinux_2_28_aarch64", plat: manylinux_2_28_aarch64 }
          - { target: macos-arm64,    runner: macos-15,         container: "" }
          - { target: macos-x86_64,   runner: macos-15-intel,   container: "" }
          - { flavor: cp311, python: "3.11" }
          - { flavor: abi3,  python: "3.12" }
          - { flavor: ft314, python: "3.14t" }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    name: ${{ matrix.target }} / ${{ matrix.flavor }}
    defaults:
      run:
        # Windows runners default to PowerShell; every step below is bash.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - uses: actions/download-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: engine-bundle

      - uses: ./.github/actions/engine-bundle

      - name: Stamp the version being released
        # Through env, so a dispatched version reaches the script as data and not as code.
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" - "$VERSION" <<'EOF'
          import re
          import sys
          from pathlib import Path

          path = Path("pyproject.toml")
          stamped, count = re.subn(r'(?m)^version = ".+"$', f'version = "{sys.argv[1]}"', path.read_text())
          if count != 1:
              sys.exit(f"expected one version line in pyproject.toml, found {count}")
          path.write_text(stamped)
          EOF

      - name: Build the wheel
        env:
          # Without a pin the wheel takes the runner's OS version as its floor and installs almost nowhere.
          # arm64 macOS starts at 11.0; Intel keeps 10.14, the floor nanobind's aligned new and delete need.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target == 'macos-arm64' && '11.0' || '10.14' }}
        run: |
          uv venv --python ${{ matrix.python }} .venv-build
          PY=.venv-build/bin/python
          [ -x "$PY" ] || PY=.venv-build/Scripts/python.exe
          VIRTUAL_ENV=.venv-build uv pip install "scikit-build-core>=0.10" "nanobind>=2.13"
          VIRTUAL_ENV=.venv-build uv build --wheel --no-build-isolation --python "$PY"

      - name: Retag Linux wheels as manylinux
        # A wheel built on the runner is tagged linux_*, which the indexes refuse; auditwheel retags it against glibc.
        if: startsWith(matrix.target, 'linux-')
        run: |
          for whl in dist/*.whl; do
            # The DuckDB library is already inside the wheel, so auditwheel must not copy it again.
            auditwheel repair "$whl" --plat ${{ matrix.plat }} \
              --exclude libduckdb.so -w dist/repaired
          done
          rm -f dist/*.whl && mv dist/repaired/*.whl dist/ && rmdir dist/repaired

      - name: Assert the stable-ABI wheel is really stable-ABI
        # STABLE_ABI silently does nothing if CMake was not asked for Development.SABIModule, so check the artifact.
        # Read as carrying no interpreter version, because the stable-ABI file name differs per platform.
        if: matrix.flavor == 'abi3'
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" - <<'EOF'
          import glob, re, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          print(whl)
          if "-abi3-" not in whl:
              sys.exit(f"wheel is not abi3-tagged: {whl}")
          names = zipfile.ZipFile(whl).namelist()
          ext = [n for n in names if "_duckdb" in n and n.endswith((".so", ".pyd", ".dylib"))]
          if not ext:
              sys.exit(f"no extension module found in {whl}: {names}")
          versioned = [n for n in ext if re.search(r"cp3\d|cpython-3\d", n)]
          if versioned:
              sys.exit(f"tagged abi3 but built for one interpreter: {versioned}")
          print("abi3 OK:", ext)
          EOF

      - name: Assert the 3.11 wheel is version-specific
        # Both the wheel tag and the extension inside must name 3.11, never abi3.
        if: matrix.flavor == 'cp311'
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" - <<'EOF'
          import glob, re, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          print(whl)
          if "-cp311-cp311-" not in whl:
              sys.exit(f"wheel is not cp311-cp311-tagged: {whl}")
          names = zipfile.ZipFile(whl).namelist()
          ext = [n for n in names if "_duckdb" in n and n.endswith((".so", ".pyd", ".dylib"))]
          if not ext:
              sys.exit(f"no extension module found in {whl}: {names}")
          if not all(re.search(r"cp311|cpython-311", n) for n in ext):
              sys.exit(f"tagged cp311 but the extension is not built for 3.11: {ext}")
          print("cp311 OK:", ext)
          EOF

      - name: The 3.11 wheel imports on 3.11
        if: matrix.flavor == 'cp311'
        run: |
          whl=$(ls "$PWD"/dist/*.whl)
          uv venv --python 3.11 "$RUNNER_TEMP/t3.11"
          PY="$RUNNER_TEMP/t3.11/bin/python"
          [ -x "$PY" ] || PY="$RUNNER_TEMP/t3.11/Scripts/python.exe"
          VIRTUAL_ENV="$RUNNER_TEMP/t3.11" uv pip install "$whl"
          # Run from elsewhere so the source tree cannot shadow the install.
          (cd "$RUNNER_TEMP" && "$PY" -c "import duckdb; print('3.11 ->', duckdb.__version__, duckdb.duckdb_version())")

      - name: One wheel, every interpreter
        if: matrix.flavor == 'abi3'
        run: |
          whl=$(ls "$PWD"/dist/*.whl)
          for v in 3.12 3.13 3.14; do
            uv venv --python $v "$RUNNER_TEMP/t$v"
            PY="$RUNNER_TEMP/t$v/bin/python"
            [ -x "$PY" ] || PY="$RUNNER_TEMP/t$v/Scripts/python.exe"
            VIRTUAL_ENV="$RUNNER_TEMP/t$v" uv pip install "$whl"
            # Run from elsewhere so the source tree cannot shadow the install.
            (cd "$RUNNER_TEMP" && "$PY" -c "import duckdb; print('$v ->', duckdb.__version__, duckdb.duckdb_version())")
          done

      - name: Free-threaded wheel keeps the GIL off
        if: matrix.flavor == 'ft314'
        run: |
          whl=$(ls "$PWD"/dist/*.whl)
          uv venv --python 3.14t "$RUNNER_TEMP/tft"
          PY="$RUNNER_TEMP/tft/bin/python"
          [ -x "$PY" ] || PY="$RUNNER_TEMP/tft/Scripts/python.exe"
          VIRTUAL_ENV="$RUNNER_TEMP/tft" uv pip install "$whl"
          (cd "$RUNNER_TEMP" && "$PY" -c "
          import sys, duckdb
          assert not sys._is_gil_enabled(), 'GIL was re-enabled on import'
          print('3.14t ->', duckdb.__version__, '(GIL off)')
          ")

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}-${{ matrix.flavor }}
          path: dist/*.whl

  test:
    name: Types and tests / ${{ matrix.python }}
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        # 3.11 has its own extension build, so the suite runs there as well.
        python: ["3.11", "3.12"]
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: engine-linux-x86_64
          path: engine-bundle

      - uses: ./.github/actions/engine-bundle
      - uses: ./.github/actions/build-and-install
        with:
          python: ${{ matrix.python }}

      # mypy needs the built extension: the stub is checked against it, not accepted in its place.
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest
      # These files are read from DuckDB's catalog, so a stale one would advertise functions it does not have.
      - name: Generated files match the generators
        run: |
          uv run --no-sync python scripts/gen_aggregates.py --check
          uv run --no-sync python scripts/gen_func_namespaces.py --check
          uv run --no-sync python scripts/gen_keywords.py --check

      # A measurement, never a gate: the previous package's tests run here and the report always exits 0.
      - name: Compat coverage report
        run: |
          uv run --no-sync python scripts/compat_report.py
          uv run --no-sync python scripts/compat_report.py --facade

  coverage:
    name: Seam coverage
    needs: engine
    # macOS only: one platform is enough, and the report script reads clang's instrumentation, not gcc's.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: engine-macos-arm64
          path: engine-bundle

      - uses: ./.github/actions/engine-bundle
        with:
          extra-defines: >-
            CMAKE_CXX_FLAGS=-fprofile-instr-generate -fcoverage-mapping;CMAKE_SHARED_LINKER_FLAGS=-fprofile-instr-generate

      - uses: ./.github/actions/build-and-install

      - name: Run the suite under instrumentation
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          mkdir -p "$RUNNER_TEMP/profraw"
          # Run from elsewhere so the source tree cannot shadow the install.
          (cd "$RUNNER_TEMP" && LLVM_PROFILE_FILE="$RUNNER_TEMP/profraw/duckdb-%p.profraw" \
            "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest "$GITHUB_WORKSPACE/tests" -q)

      - name: Report and gate
        run: |
          SO=$(find build -name '_duckdb*.so' | head -1)
          uv run --no-sync python scripts/seam_coverage.py "$RUNNER_TEMP/profraw" "$SO" \
            --min-lines 90 | tee "$GITHUB_STEP_SUMMARY"
