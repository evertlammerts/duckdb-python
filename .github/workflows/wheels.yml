# Builds and verifies the wheel matrix against the prebuilt DuckDB engine.
# Three per platform: 3.11 alone because nanobind's stable ABI starts at 3.12, one for 3.12 and up, one free-threaded.
name: Build and test

on:
  push:
    branches: [neo]
  pull_request:
    branches: [neo]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Stamp this version into pyproject.toml before building.
        required: false
        type: string
        default: ""

# A newer push to the same ref supersedes whatever is still running.
# Set on the caller only: a called workflow dies with its caller, and a second group there risks a deadlock.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    uses: ./.github/workflows/engine.yml

  wheel:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        # target and flavor are real axes so they multiply; targets moved into include collapse to one job per flavor.
        target:
          [windows-amd64, windows-arm64, linux-x86_64, linux-aarch64, macos-arm64, macos-x86_64]
        # One CMake path serves all three: nanobind applies each setting only where it fits.
        flavor: [cp311, abi3, ft314]
        exclude:
          # No free-threaded CPython for Windows on ARM64, and uv quietly installs the x86_64 build instead.
          - target: windows-arm64
            flavor: ft314
        # suite: the interpreters the test suite runs on; the stable-ABI wheel on the oldest and newest it serves.
        # omit: test dependencies with no build there; the tests needing them skip.
        include:
          # engine_platform names the prebuilt archive for the build target; engine_python pins the helper
          # interpreter where uv would otherwise pick an emulated one.
          - { target: windows-amd64,  runner: windows-2022,     container: "", engine_platform: windows-amd64 }
          - { target: windows-arm64,  runner: windows-11-arm,   container: "", engine_platform: windows-arm64, engine_python: cpython-3.12-windows-aarch64, omit: pyarrow }
          - { target: linux-x86_64,   runner: ubuntu-24.04,     container: "quay.io/pypa/manylinux_2_28_x86_64",  plat: manylinux_2_28_x86_64, engine_platform: linux-amd64 }
          - { target: linux-aarch64,  runner: ubuntu-24.04-arm, container: "quay.io/pypa/manylinux_2_28_aarch64", plat: manylinux_2_28_aarch64, engine_platform: linux-arm64 }
          - { target: macos-arm64,    runner: macos-15,         container: "", engine_platform: osx-arm64 }
          - { target: macos-x86_64,   runner: macos-15-intel,   container: "", engine_platform: osx-amd64 }
          - { flavor: cp311, python: "3.11",  suite: "3.11" }
          - { flavor: abi3,  python: "3.12",  suite: "3.12 3.14" }
          - { flavor: ft314, python: "3.14t", suite: "3.14t", omit: "polars polars-runtime-32" }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    name: ${{ matrix.target }} / ${{ matrix.flavor }}
    # A hung test would otherwise hold the runner for GitHub's six-hour default.
    timeout-minutes: 30
    env:
      # Without the architecture, uv on Windows on ARM64 installs an x86_64 CPython when the runner has no native one.
      PYTHON_REQUEST: ${{ matrix.target == 'windows-arm64' && format('cpython-{0}-windows-aarch64', matrix.python) || matrix.python }}
    defaults:
      run:
        # Windows runners default to PowerShell; every step below is bash.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - uses: ./.github/actions/engine
        with:
          engine: ${{ needs.engine.outputs.engine }}
          platform: ${{ matrix.engine_platform }}
          python: ${{ matrix.engine_python || '3.12' }}
          install: tpch

      - name: Stamp the version being released
        # Through env, so a dispatched version reaches the script as data and not as code.
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" - "$VERSION" <<'EOF'
          import re
          import sys
          from pathlib import Path

          path = Path("pyproject.toml")
          stamped, count = re.subn(r'(?m)^version = ".+"$', f'version = "{sys.argv[1]}"', path.read_text())
          if count != 1:
              sys.exit(f"expected one version line in pyproject.toml, found {count}")
          path.write_text(stamped)
          EOF

      - name: Build the wheel
        env:
          # Without a pin the wheel takes the runner's OS version as its floor and installs almost nowhere.
          # 11.0 on both architectures: the prebuilt libduckdb dylibs carry minos 11.0.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          uv venv --python "$PYTHON_REQUEST" .venv-build
          PY=.venv-build/bin/python
          [ -x "$PY" ] || PY=.venv-build/Scripts/python.exe
          VIRTUAL_ENV=.venv-build uv pip install "scikit-build-core>=1.1" "nanobind>=2.13"
          VIRTUAL_ENV=.venv-build uv build --wheel --no-build-isolation --python "$PY"

      - name: Retag Linux wheels as manylinux
        # A wheel built on the runner is tagged linux_*, which the indexes refuse; auditwheel retags it against glibc.
        if: startsWith(matrix.target, 'linux-')
        run: |
          for whl in dist/*.whl; do
            # The DuckDB library is already inside the wheel, so auditwheel must not copy it again.
            auditwheel repair "$whl" --plat ${{ matrix.plat }} \
              --exclude libduckdb.so -w dist/repaired
          done
          rm -f dist/*.whl && mv dist/repaired/*.whl dist/ && rmdir dist/repaired

      - name: Assert the stable-ABI wheel is really stable-ABI
        # STABLE_ABI silently does nothing if CMake was not asked for Development.SABIModule, so check the artifact.
        # Read as carrying no interpreter version, because the stable-ABI file name differs per platform.
        if: matrix.flavor == 'abi3'
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" - <<'EOF'
          import glob, re, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          print(whl)
          if "-abi3-" not in whl:
              sys.exit(f"wheel is not abi3-tagged: {whl}")
          names = zipfile.ZipFile(whl).namelist()
          ext = [n for n in names if "_duckdb" in n and n.endswith((".so", ".pyd", ".dylib"))]
          if not ext:
              sys.exit(f"no extension module found in {whl}: {names}")
          versioned = [n for n in ext if re.search(r"cp3\d|cpython-3\d", n)]
          if versioned:
              sys.exit(f"tagged abi3 but built for one interpreter: {versioned}")
          print("abi3 OK:", ext)
          EOF

      - name: Assert the 3.11 wheel is version-specific
        # Both the wheel tag and the extension inside must name 3.11, never abi3.
        if: matrix.flavor == 'cp311'
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" - <<'EOF'
          import glob, re, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          print(whl)
          if "-cp311-cp311-" not in whl:
              sys.exit(f"wheel is not cp311-cp311-tagged: {whl}")
          names = zipfile.ZipFile(whl).namelist()
          ext = [n for n in names if "_duckdb" in n and n.endswith((".so", ".pyd", ".dylib"))]
          if not ext:
              sys.exit(f"no extension module found in {whl}: {names}")
          if not all(re.search(r"cp311|cpython-311", n) for n in ext):
              sys.exit(f"tagged cp311 but the extension is not built for 3.11: {ext}")
          print("cp311 OK:", ext)
          EOF

      - name: The 3.11 wheel imports on 3.11
        if: matrix.flavor == 'cp311'
        run: |
          whl=$(ls "$PWD"/dist/*.whl)
          uv venv --python "$PYTHON_REQUEST" "$RUNNER_TEMP/t3.11"
          PY="$RUNNER_TEMP/t3.11/bin/python"
          [ -x "$PY" ] || PY="$RUNNER_TEMP/t3.11/Scripts/python.exe"
          VIRTUAL_ENV="$RUNNER_TEMP/t3.11" uv pip install "$whl"
          # Run from elsewhere so the source tree cannot shadow the install.
          (cd "$RUNNER_TEMP" && "$PY" -c "import duckdb; print('3.11 ->', duckdb.__version__, duckdb.duckdb_version())")

      - name: One wheel, every interpreter
        if: matrix.flavor == 'abi3'
        run: |
          whl=$(ls "$PWD"/dist/*.whl)
          for v in 3.12 3.13 3.14; do
            uv venv --python $v "$RUNNER_TEMP/t$v"
            PY="$RUNNER_TEMP/t$v/bin/python"
            [ -x "$PY" ] || PY="$RUNNER_TEMP/t$v/Scripts/python.exe"
            VIRTUAL_ENV="$RUNNER_TEMP/t$v" uv pip install "$whl"
            # Run from elsewhere so the source tree cannot shadow the install.
            (cd "$RUNNER_TEMP" && "$PY" -c "import duckdb; print('$v ->', duckdb.__version__, duckdb.duckdb_version())")
          done

      - name: Free-threaded wheel keeps the GIL off
        if: matrix.flavor == 'ft314'
        run: |
          whl=$(ls "$PWD"/dist/*.whl)
          uv venv --python 3.14t "$RUNNER_TEMP/tft"
          PY="$RUNNER_TEMP/tft/bin/python"
          [ -x "$PY" ] || PY="$RUNNER_TEMP/tft/Scripts/python.exe"
          VIRTUAL_ENV="$RUNNER_TEMP/tft" uv pip install "$whl"
          (cd "$RUNNER_TEMP" && "$PY" -c "
          import sys, duckdb
          assert not sys._is_gil_enabled(), 'GIL was re-enabled on import'
          print('3.14t ->', duckdb.__version__, '(GIL off)')
          ")

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}-${{ matrix.flavor }}
          path: dist/*.whl

      - name: The test suite against the wheel
        # After the upload, so a wheel that fails here can still be downloaded to reproduce it.
        env:
          OMIT: ${{ matrix.omit }}
          SUITE: ${{ matrix.suite }}
          TARGET: ${{ matrix.target }}
        run: |
          whl=$(ls "$PWD"/dist/*.whl)
          omit=()
          for package in $OMIT; do omit+=(--no-emit-package "$package"); done
          uv export --only-group test --no-emit-project --no-hashes "${omit[@]}" -o "$RUNNER_TEMP/test-requirements.txt"
          failed=""
          for v in $SUITE; do
            request=$v
            # Same reason as PYTHON_REQUEST above.
            if [ "$TARGET" = windows-arm64 ]; then request="cpython-$v-windows-aarch64"; fi
            uv venv --python "$request" "$RUNNER_TEMP/suite$v"
            PY="$RUNNER_TEMP/suite$v/bin/python"
            [ -x "$PY" ] || PY="$RUNNER_TEMP/suite$v/Scripts/python.exe"
            # Wheels only: a source build of a missing dependency would fail late and obscurely, or take an hour.
            VIRTUAL_ENV="$RUNNER_TEMP/suite$v" uv pip install --only-binary :all: -r "$RUNNER_TEMP/test-requirements.txt" "$whl"
            # Run from elsewhere so the source tree cannot shadow the install.
            # Every interpreter runs even after a failure, so one CI run shows all that fail.
            (cd "$RUNNER_TEMP" && "$PY" -m pytest "$GITHUB_WORKSPACE/tests") || failed="$failed $v"
          done
          if [ -n "$failed" ]; then echo "the suite failed on:$failed"; exit 1; fi

  test:
    name: Types and generated files / ${{ matrix.python }}
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        # mypy reads the stubs of the installed libraries, and 3.11 installs an older numpy than 3.12 does.
        python: ["3.11", "3.12"]
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - uses: ./.github/actions/engine
        with:
          engine: ${{ needs.engine.outputs.engine }}
          platform: linux-amd64
      - uses: ./.github/actions/build-and-install
        with:
          python: ${{ matrix.python }}

      # mypy needs the built extension: the stub is checked against it, not accepted in its place.
      - run: uv run --no-sync mypy
      # These files are read from DuckDB's catalog, so a stale one would advertise functions it does not have.
      - name: Generated files match the generators
        run: |
          uv run --no-sync python scripts/gen_aggregates.py --check
          uv run --no-sync python scripts/gen_func_namespaces.py --check
          uv run --no-sync python scripts/gen_keywords.py --check

  coverage:
    name: Seam coverage
    needs: engine
    # macOS only: one platform is enough, and the report script reads clang's instrumentation, not gcc's.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - uses: ./.github/actions/engine
        with:
          engine: ${{ needs.engine.outputs.engine }}
          platform: osx-arm64
          install: tpch
          extra-defines: >-
            CMAKE_CXX_FLAGS=-fprofile-instr-generate -fcoverage-mapping;CMAKE_SHARED_LINKER_FLAGS=-fprofile-instr-generate

      - uses: ./.github/actions/build-and-install

      - name: Run the suite under instrumentation
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          mkdir -p "$RUNNER_TEMP/profraw"
          # Run from elsewhere so the source tree cannot shadow the install.
          (cd "$RUNNER_TEMP" && LLVM_PROFILE_FILE="$RUNNER_TEMP/profraw/duckdb-%p.profraw" \
            "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest "$GITHUB_WORKSPACE/tests" -q)

      - name: Report and gate
        run: |
          SO=$(find build -name '_duckdb*.so' | head -1)
          uv run --no-sync python scripts/seam_coverage.py "$RUNNER_TEMP/profraw" "$SO" \
            --min-lines 90 | tee "$GITHUB_STEP_SUMMARY"

  sanitizers:
    name: Sanitizers / ${{ matrix.target }}
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64,  runner: ubuntu-24.04,     engine_platform: linux-amd64 }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm, engine_platform: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # Only the extension is instrumented; the engine is the release library the wheels ship.
      - uses: ./.github/actions/engine
        with:
          engine: ${{ needs.engine.outputs.engine }}
          platform: ${{ matrix.engine_platform }}
          install: tpch
          extra-defines: >-
            CMAKE_CXX_FLAGS=-fsanitize=address,undefined -fsanitize-recover=address,undefined -fno-omit-frame-pointer;CMAKE_MODULE_LINKER_FLAGS=-fsanitize=address,undefined

      - name: Build the extension with AddressSanitizer and UBSan
        env:
          # gcc, because the runtime preloaded below is gcc's.
          CC: gcc
          CXX: g++
          # nanobind strips Release builds, and a report without symbols names no functions.
          SKBUILD_CMAKE_BUILD_TYPE: RelWithDebInfo
          SKBUILD_INSTALL_STRIP: "false"
        run: |
          uv venv --python 3.12 .venv-build
          VIRTUAL_ENV=.venv-build uv pip install "scikit-build-core>=1.1" "nanobind>=2.13"
          VIRTUAL_ENV=.venv-build uv build --wheel --no-build-isolation --python .venv-build/bin/python
          uv export --only-group test --no-emit-project --no-hashes -o "$RUNNER_TEMP/test-requirements.txt"
          uv venv --python 3.12 "$RUNNER_TEMP/suite"
          VIRTUAL_ENV="$RUNNER_TEMP/suite" uv pip install --only-binary :all: -r "$RUNNER_TEMP/test-requirements.txt" dist/*.whl

      - name: The sanitizers are live
        # A run without reports proves nothing unless a real error would have been reported.
        run: |
          SO=$(ls "$RUNNER_TEMP"/suite/lib/python3.12/site-packages/duckdb/_duckdb*.so)
          readelf -d "$SO" | grep NEEDED
          readelf -d "$SO" | grep -q libasan
          readelf -d "$SO" | grep -q libubsan
          echo "vm.mmap_rnd_bits: $(sudo sysctl -n vm.mmap_rnd_bits)"
          mkdir -p "$RUNNER_TEMP/probe"
          FORMAT="'    #%n %p %F %L (%m+%o)'"
          # Python's own allocator would put the buffer inside a pool, where an over-read stays unseen.
          # The probe's exit status says nothing, a runtime that aborts exits 1 too; its report is what counts.
          LD_PRELOAD="$(gcc -print-file-name=libasan.so) $(gcc -print-file-name=libstdc++.so)" PYTHONMALLOC=malloc \
            ASAN_OPTIONS="detect_leaks=0:halt_on_error=0:log_path=$RUNNER_TEMP/probe/asan:stack_trace_format=$FORMAT" \
            "$RUNNER_TEMP/suite/bin/python" -c \
            "import ctypes, duckdb; ctypes.memmove(ctypes.create_string_buffer(64), ctypes.create_string_buffer(8), 64)" \
            || echo "the probe exited $?"
          head -n 6 "$RUNNER_TEMP"/probe/asan.* 2>/dev/null || echo "the probe wrote no report"
          grep -q "ERROR: AddressSanitizer: heap-buffer-overflow" "$RUNNER_TEMP"/probe/asan.*
          # The format took: a frame without debug info names its module twice, where the default names it once.
          grep -qE "\([^()]+\+0x[0-9a-f]+\).*\([^()]+\+0x[0-9a-f]+\)" "$RUNNER_TEMP"/probe/asan.*

      - name: The test suite under the sanitizers
        id: suite
        run: |
          LOGS="$RUNNER_TEMP/sanitizer-logs"
          mkdir -p "$LOGS"
          # Every frame names its module, which the report script needs to tell who a leak belongs to.
          FORMAT="'    #%n %p %F %L (%m+%o)'"
          # The interpreter is not instrumented, so the runtime is preloaded, and Python allocates through malloc
          # so that its objects are checked too. libstdc++ comes along because ASan looks up its __cxa_throw at
          # start, before the extension loads it, and the first C++ exception would then abort the process.
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so) $(gcc -print-file-name=libstdc++.so)" PYTHONMALLOC=malloc
          export ASAN_OPTIONS="detect_leaks=1:halt_on_error=0:log_path=$LOGS/asan:stack_trace_format=$FORMAT"
          export UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=0:log_path=$LOGS/ubsan:stack_trace_format=$FORMAT"
          # Run from elsewhere so the source tree cannot shadow the install.
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/suite/bin/python" -m pytest "$GITHUB_WORKSPACE/tests")

      - name: Judge the reports
        # The run exits 0 whatever it found; the reports decide.
        if: ${{ !cancelled() && steps.suite.conclusion != 'skipped' }}
        run: '"$RUNNER_TEMP/suite/bin/python" scripts/sanitizer_report.py "$RUNNER_TEMP/sanitizer-logs"'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sanitizer-logs-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/sanitizer-logs
            ${{ runner.temp }}/probe
