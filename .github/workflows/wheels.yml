# Builds and verifies the wheel matrix against the engine bundle.
#
# Two wheels per platform: one stable-ABI wheel covering CPython 3.12 and every
# later version, and one free-threaded wheel per free-threaded interpreter.
name: Build and test

on:
  push:
    branches: [neo]
  pull_request:
    branches: [neo]
  workflow_dispatch:

# A newer push to the same ref supersedes whatever is still running. Set on the
# caller only: engine.yml is reached through workflow_call, and a called
# workflow's jobs are cancelled with the run that called them, so a second
# group here would only risk a deadlock.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    uses: ./.github/workflows/engine.yml

  wheel:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        # target and flavor are real axes so they cross-product: 6 x 2 = 12
        # jobs. `include` only attaches fields to those combinations. Putting
        # the targets in `include` instead silently collapses the matrix to one
        # job per flavor, because include entries do not multiply, they merge
        # and the last match wins.
        target:
          [windows-amd64, windows-arm64, linux-x86_64, linux-aarch64, macos-arm64, macos-x86_64]
        # STABLE_ABI applies on non-free-threaded >= 3.12; FREE_THREADED applies
        # on t interpreters. One CMake path serves both.
        flavor: [abi3, ft314]
        include:
          - { target: windows-amd64,  runner: windows-2022,     container: "" }
          - { target: windows-arm64,  runner: windows-11-arm,   container: "" }
          - { target: linux-x86_64,   runner: ubuntu-24.04,     container: "quay.io/pypa/manylinux_2_28_x86_64",  plat: manylinux_2_28_x86_64 }
          - { target: linux-aarch64,  runner: ubuntu-24.04-arm, container: "quay.io/pypa/manylinux_2_28_aarch64", plat: manylinux_2_28_aarch64 }
          - { target: macos-arm64,    runner: macos-15,         container: "" }
          - { target: macos-x86_64,   runner: macos-15-intel,   container: "" }
          - { flavor: abi3,  python: "3.12" }
          - { flavor: ft314, python: "3.14t" }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    name: ${{ matrix.target }} / ${{ matrix.flavor }}
    defaults:
      run:
        # Windows runners default to PowerShell; every step below is bash.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - uses: actions/download-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: engine-bundle

      - name: Build the wheel
        env:
          # Without a pin the wheel takes the runner's OS version as its floor
          # and installs almost nowhere. The floor is per arch: arm64 macOS did
          # not exist before 11.0 and packaging generates no arm64 tag below
          # it, so a 10.x arm64 wheel is uninstallable on Apple Silicon.
          # Intel keeps 10.14, the floor nanobind's aligned new/delete needs.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target == 'macos-arm64' && '11.0' || '10.14' }}
        run: |
          # Resolve the bundle path in the shell, not through
          # ${{ github.workspace }}: that expression yields the HOST path,
          # which is not where the workspace is mounted inside a container, and
          # on Windows it yields backslashes that CMake parses as escapes.
          # cygpath -m gives CMake-friendly "D:/a/..." on the Windows runners.
          if command -v cygpath >/dev/null 2>&1; then
            BUNDLE="$(cygpath -m "$PWD")/engine-bundle"
          else
            BUNDLE="$PWD/engine-bundle"
          fi
          export SKBUILD_CMAKE_DEFINE="DUCKDB_CPP_DIR=$BUNDLE;DUCKDB_ROOT=$BUNDLE"
          # The bundle is self-contained: it carries duckdb_cpp.{hpp,cpp}, the
          # two v2 headers, DuckDBCppApi.cmake, and the library, so one path
          # serves as both the C++ API directory and the library prefix.
          uv venv --python ${{ matrix.python }} .venv-build
          PY=.venv-build/bin/python
          [ -x "$PY" ] || PY=.venv-build/Scripts/python.exe
          VIRTUAL_ENV=.venv-build uv pip install "scikit-build-core>=0.10" "nanobind>=2.13"
          VIRTUAL_ENV=.venv-build uv build --wheel --no-build-isolation --python "$PY"

      - name: Retag Linux wheels as manylinux
        # A wheel built straight on the runner is tagged linux_*, which PyPI
        # and test.pypi both refuse. auditwheel rewrites the tag against the
        # glibc the extension actually needs. The engine is already inside the
        # wheel, so this is a retag and an rpath fix, not a vendoring step.
        if: startsWith(matrix.target, 'linux-')
        run: |
          for whl in dist/*.whl; do
            # --exclude: the engine is already inside the wheel and was built
            # in this image, so auditwheel must not copy it a second time.
            auditwheel repair "$whl" --plat ${{ matrix.plat }} \
              --exclude libduckdb.so -w dist/repaired
          done
          rm -f dist/*.whl && mv dist/repaired/*.whl dist/ && rmdir dist/repaired

      - name: Assert the stable-ABI wheel is really stable-ABI
        # STABLE_ABI silently no-ops if CMake was not asked for
        # Development.SABIModule: the wheel is still TAGGED cp312-abi3 while the
        # extension inside carries a version-specific suffix. Assert on the
        # artifact, never on the build log.
        if: matrix.flavor == 'abi3'
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" - <<'EOF'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          print(whl)
          if "-abi3-" not in whl:
              sys.exit(f"wheel is not abi3-tagged: {whl}")
          names = zipfile.ZipFile(whl).namelist()
          ext = [n for n in names if "_duckdb" in n and n.endswith((".so", ".pyd", ".dylib"))]
          if not any(".abi3." in n for n in ext):
              sys.exit(f"tagged abi3 but the extension is version-tagged: {ext}")
          print("abi3 OK:", ext)
          EOF

      - name: One wheel, every interpreter
        if: matrix.flavor == 'abi3'
        run: |
          whl=$(ls "$PWD"/dist/*.whl)
          for v in 3.12 3.13 3.14; do
            uv venv --python $v "$RUNNER_TEMP/t$v"
            PY="$RUNNER_TEMP/t$v/bin/python"
            [ -x "$PY" ] || PY="$RUNNER_TEMP/t$v/Scripts/python.exe"
            VIRTUAL_ENV="$RUNNER_TEMP/t$v" uv pip install "$whl"
            # Run from elsewhere so the source tree cannot shadow the install.
            (cd "$RUNNER_TEMP" && "$PY" -c "import duckdb; print('$v ->', duckdb.__version__, duckdb.duckdb_version())")
          done

      - name: Free-threaded wheel keeps the GIL off
        if: matrix.flavor == 'ft314'
        run: |
          whl=$(ls "$PWD"/dist/*.whl)
          uv venv --python 3.14t "$RUNNER_TEMP/tft"
          PY="$RUNNER_TEMP/tft/bin/python"
          [ -x "$PY" ] || PY="$RUNNER_TEMP/tft/Scripts/python.exe"
          VIRTUAL_ENV="$RUNNER_TEMP/tft" uv pip install "$whl"
          (cd "$RUNNER_TEMP" && "$PY" -c "
          import sys, duckdb
          assert not sys._is_gil_enabled(), 'GIL was re-enabled on import'
          print('3.14t ->', duckdb.__version__, '(GIL off)')
          ")

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}-${{ matrix.flavor }}
          path: dist/*.whl

  test:
    name: Types and tests
    needs: engine
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: engine-linux-x86_64
          path: engine-bundle

      - name: Build and install
        # --no-build-isolation needs the build backend already present, so the
        # build group goes in first and stays in for the project build. Without
        # the pin uv picks the newest interpreter in the image, which is a 3.15
        # release candidate.
        run: |
          # Resolve the bundle path in the shell, not through
          # ${{ github.workspace }}: that expression yields the HOST path,
          # which is not where the workspace is mounted inside a container, and
          # on Windows it yields backslashes that CMake parses as escapes.
          # cygpath -m gives CMake-friendly "D:/a/..." on the Windows runners.
          if command -v cygpath >/dev/null 2>&1; then
            BUNDLE="$(cygpath -m "$PWD")/engine-bundle"
          else
            BUNDLE="$PWD/engine-bundle"
          fi
          export SKBUILD_CMAKE_DEFINE="DUCKDB_CPP_DIR=$BUNDLE;DUCKDB_ROOT=$BUNDLE"
          uv sync --only-group build --no-install-project --python 3.12
          uv sync --no-build-isolation --group build --group dev --python 3.12

      # mypy needs the built extension present: the stub is checked against it,
      # not accepted in place of it.
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest
