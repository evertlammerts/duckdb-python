name: Build and install the project
description: Install the build backend, then build the project against it.

inputs:
  python:
    description: Interpreter to build against.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    # Two steps because --no-build-isolation needs the backend installed before the project is built.
    # The interpreter is pinned: uv otherwise picks the newest in the image, a release candidate on manylinux.
    - shell: bash
      run: |
        uv sync --only-group build --no-install-project --python "${{ inputs.python }}"
        uv sync --no-build-isolation --group build --group dev --group compat --python "${{ inputs.python }}"
