name: Resolve the engine bundle
description: Point the build at a downloaded DuckDB bundle by exporting SKBUILD_CMAKE_DEFINE.

inputs:
  path:
    description: Bundle directory, relative to the workspace.
    required: false
    default: engine-bundle
  extra-defines:
    description: Extra semicolon-separated CMake defines, appended verbatim.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The path is resolved in the shell: the workspace expression gives the host path, wrong inside a container.
    - shell: bash
      # Through env, never interpolated: extra-defines carries spaces and semicolons the shell must see as data.
      env:
        BUNDLE_PATH: ${{ inputs.path }}
        EXTRA_DEFINES: ${{ inputs.extra-defines }}
      run: |
        # cygpath -m gives CMake-friendly "D:/a/..." on the Windows runners.
        if command -v cygpath >/dev/null 2>&1; then
          BUNDLE="$(cygpath -m "$PWD")/$BUNDLE_PATH"
        else
          BUNDLE="$PWD/$BUNDLE_PATH"
        fi
        # The bundle is self-contained, so one path serves as both the C++ API directory and the library prefix.
        DEFINES="DUCKDB_CPP_DIR=$BUNDLE;DUCKDB_ROOT=$BUNDLE"
        if [ -n "$EXTRA_DEFINES" ]; then
          DEFINES="$DEFINES;$EXTRA_DEFINES"
        fi
        echo "SKBUILD_CMAKE_DEFINE=$DEFINES" >> "$GITHUB_ENV"
